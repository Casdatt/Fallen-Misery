<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config</title>

    <style>
        body { font-family: monospace; background-color: black; color: seagreen; text-align: center; }
        button { border: 0.6vw solid dimgrey; width: 20vw; height: 16vh; margin-top: 5.5vh; font-size: 2.5vw; background-color: grey;}
        .big:hover { background-color: indianred; scale: 1.5 }
        button:hover { background-color: burlywood; scale: 1.3 }
    </style>
</head>
<body>
    <div>
        <button>Option A</button><br>
        <button>Option B</button><br>
        <button onclick="changePlayerName()">Change Name 🤠</button><br><br><br>
        <a href="index.html"><button class="big">⬅️ Go back</button></a><br>
    </div>
    <script>

        let sessionId = localStorage.getItem("game_session_id");
        if (!sessionId) {
            sessionId = "player_" + Math.random().toString(36).substring(2, 9);
            localStorage.setItem("game_session_id", sessionId);
        }
        
        async function changePlayerName() {
            const newName = prompt("Write the new name")
            if (!newName || newName.trim() == "") {
                return;
            }
            try {
                const answer = await fetch (`https://sandpaper-purposely-droplet.ngrok-free.dev/action?cmd=setName&name=${encodeURIComponent(newName)}&sessionId=${sessionId}`, {
                    headers: {
                        "ngrok-skip-browser-warning": "69420"
                    }
                });
                const data = await answer.json();
                alert("Hi " + data.message + ", nice to meet you!");
    
            } catch (error) {
                console.error("Conexion error:", error);
                alert("Unable to connect to server.");
            }
        }
    </script>
</body>
