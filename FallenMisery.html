<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FallenMisery</title>

    <style>
        body { font-family: monospace; background-color: dimgrey; text-align: center; }

        .stats { background-color: indianred; padding-left: 0.2vw; border: 0.2vw solid burlywood; width: 10vw; height: 25vh; font-size: 2vh; overflow-wrap: break-word; word-break: break-all; text-align: left; }

        .petstats { color: white; text-align: center; font-size: 1.4vw }

        .actionmenu {  background-color: black; position: absolute; left: 0vw; bottom: 0vh; height: 40vh; width: 70vw; border-top: 0.3vh solid white; }

        .petmenu { background-color: black; position: absolute; left: 69.8vw; bottom: 0vh; height: 40vh; width: 30vw; border-left: 0.2vw solid white; border-top: 0.3vh solid white; }

        .actions { margin-left: 10vw; margin-right: 10vw; height: 8vh; margin-top: 7vh ; margin-bottom: 2vh; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20vw; }

        .actionspets { margin-left: 3vw; margin-right: 3vw; height: 8vh; margin-top: 11vh ; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4vw; }

        button { background-color: black; color: white; border: 0.4vw solid limegreen; }

        .acpet { border: 0.4vw solid darkblue; }

        .ac:hover { transform: scale(1.2); background-color: greenyellow; color: black;  }

        .acpet:hover { transform: scale(1.2); background-color: royalblue; color: black;  }

        .menu:hover { transform: scale(1.1); background-color: indianred; color: black }
    </style>

</head>
<body>
<div class="stats">
    <p><b><span id="playerName">-</span></b></p>
    <p><b>Health:</b> <span id="playerCurrentHp">-</span><span>/</span><span id="playerHp">-</span></p>
    <p><b>Damage:</b> <span id="playerDmg">-</span></p>
    <p><b>Weapon:</b> <span id="playerWeapon">-</span></p>
    <p><b>Round:</b> <span id="round">0</span>.<span id="turn">0</span></p>
</div>
<div class ="actionmenu">
    <p id="log" style="color: yellow; margin-top: 5vh; text-align: center; font-size: 4vh;">...</p>
    <div class ="actions">
        <button class="ac"><b>Attack</b></button>
        <button class="ac"><b>Power</b></button>
    </div>
    <a href="index.html"><button class="menu" style="width: 28vw; margin-top: 2vh; height: 8vh;"><b>⬅️ Menu</b></button></a>
</div>
<div class ="petmenu">

    <div class ="petstats">
        <p><b><span id="petName">-</span></b></p>
        <b>Health:</b> <span id="petCurrentHp">-</span><span>/</span><span id="pettHp">-</span>
        <b>Damage:</b> <span id="petDmg">-</span>
        <b>Weapon:</b> <span id="petWeapon">-</span>
    </div>

    <div class="actionspets">
        <button class="acpet"><b>Attack</b></button>
        <button class="acpet"><b>Power</b></button>
    </div>
</div>

<script>
    const API_URL = "https://sandpaper-purposely-droplet.ngrok-free.dev";
    const ngrokHeaders = {
      "ngrok-skip-browser-warning": "true"
    };

    let sessionId = localStorage.getItem("game_session_id");
    if (!sessionId) {
      sessionId = "player_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("game_session_id", sessionId);
    }

    async function updateStatus() {
      try {
        const res = await fetch(`${API_URL}/status?sessionId=${sessionId}`, { headers: ngrokHeaders });
        const data = await res.json();
        document.getElementById("playerName").textContent = data.name;
        document.getElementById("playerHp").textContent = data.health;
        document.getElementById("playerCurrentHp").textContent = data.currentHealth
        document.getElementById("playerDmg").textContent = data.damage;
        document.getElementById("playerWeapon").textContent = data.weapon;
        document.getElementById("round").textContent = data.round;
        document.getElementById("turn").textContent = data.turn;

        const petMenu = document.querySelector(".petmenu");
        const actionMenu = document.querySelector(".actionmenu");

        if (data.petName && data.petName.trim() !== "") {
            petMenu.style.display = "block";
            actionMenu.style.width = "70vw";

            document.getElementById("petName").textContent = data.petName;
            document.getElementById("petHp").textContent = data.petHealth;
            document.getElementById("petCurrentHp").textContent = data.petCurrentHealth
            document.getElementById("petDmg").textContent = data.petDamage;
            document.getElementById("petWeapon").textContent = data.petWeapon;
        } 
        else {
            petMenu.style.display = "none";
            actionMenu.style.width = "100vw";
            }
      } catch (err) {
        document.getElementById("log").textContent = "Error attempting to connect to the Java server.";
      }
    }
    updateStatus();
</script>
</body>
