<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FallenMisery</title>

    <style>
        body { font-family: monospace; background-color: dimgrey; text-align: center; }

        .stats { background-color: indianred; padding-left: 0.2vw; border: 0.2vw solid burlywood; width: 10vw; height: 30vh; font-size: 2vh; overflow-wrap: break-word; word-break: break-all; text-align: left; position: absolute; }

        .petstats { color: white; text-align: center; font-size: 1.4vw }

        .enemy-zone { display: flex; justify-content: center; align-items: center; gap: 2vw; height: 20vh; margin-top: 5vh; }

        .enemy-btn { background-color: green; color: black; border: 0.3vw solid orange; padding: 1.5vh 1.5vw; text-align: center; font-size: 1.8vh; min-width: 10vw; cursor: pointer; }

        .enemy-btn:hover { background-color: red; transform: scale(1.08) }

        .enemy-btn.selected { background-color: yellowgreen; transform: scale(1.12) }

        .actionmenu {  background-color: black; position: absolute; left: 0vw; bottom: 0vh; height: 40vh; width: 70vw; border-top: 0.3vh solid white; }

        .petmenu { background-color: black; position: absolute; left: 69.8vw; bottom: 0vh; height: 40vh; width: 30vw; border-left: 0.2vw solid white; border-top: 0.3vh solid white; }

        .actions { margin-left: 10vw; margin-right: 10vw; height: 8vh; margin-top: 7vh ; margin-bottom: 2vh; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20vw; }

        .actionspets { margin-left: 3vw; margin-right: 3vw; height: 8vh; margin-top: 11vh ; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4vw; }

        button { background-color: black; color: white; border: 0.4vw solid limegreen; }

        .acpet { border: 0.4vw solid darkblue; font-size: 1vw; }

        .ac { font-size: 1.4vw; }

        .ac:hover { transform: scale(1.2); background-color: greenyellow; color: black;  }

        .acpet:hover { transform: scale(1.2); background-color: royalblue; color: black;  }

        .menu { font-size: 1vw }

        .menu:hover { transform: scale(1.1); background-color: indianred; color: black }
    </style>

</head>
<body>
<div class="stats">
    <p><b><span id="playerName">Handsome</span></b></p>
    <p><b>Level:</b> <span id="playerLevel">0</span></p>
    <p><b>Health:</b> <span id="playerCurrentHp">11.9</span><span>/</span><span id="playerHp">12</span></p>
    <p><b>Damage:</b> <span id="playerDmg">3.0</span></p>
    <p><b>Weapon:</b> <span id="playerWeapon">FISTS</span></p>
    <p><b>Round:</b> <span id="round">0</span>.<span id="turn">0</span></p>
</div>
<div id="enemyZone" class="enemy-zone"></div>
<div class ="actionmenu">
    <p id="log" style="color: yellow; margin-top: 5vh; text-align: center; font-size: 3vh;">...</p>
    <div class ="actions">
        <button class="ac"><b>Attack</b></button>
        <button class="ac"><b>Power</b></button>
    </div>
    <a href="index.html"><button class="menu" style="width: 28vw; margin-top: 2vh; height: 8vh;"><b>⬅️ Menu</b></button></a>
</div>
<div class ="petmenu">

    <div class ="petstats">
        <p><b><span id="petName">---------------</span></b></p>
        <b>Level:</b> <span id="petLevel">0</span>
        <b>Health:</b> <span id="petCurrentHp">4.9</span><span>/</span><span id="petHp">5</span>
        <b>Damage:</b> <span id="petDmg">4.0</span>
    </div>

    <div class="actionspets">
        <button class="acpet"><b>Attack</b></button>
        <button class="acpet"><b>Power</b></button>
    </div>
</div>

<script>
    const API_URL = "https://sandpaper-purposely-droplet.ngrok-free.dev";
    const ngrokHeaders = {
      "ngrok-skip-browser-warning": "true"
    };

    let sessionId = localStorage.getItem("game_session_id");

    if (!sessionId) {
      sessionId = "player_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("game_session_id", sessionId);
    }

    let selectedEnemyIndex = 0;

    function renderEnemies(enemies) {
        const container = document.getElementById("enemyZone");
        container.innerHTML = "";

        if (!enemies || enemies.length === 0) return;

        if (!enemies[selectedEnemyIndex] || enemies[selectedEnemyIndex].currentHealth <= 0) {
            selectedEnemyIndex = enemies.findIndex(e => e.currentHealth > 0);
        }

        enemies.forEach((enemy, index) => {
            if (enemy.currentHealth <= 0) return;

            const btn = document.createElement("button");
            btn.className = "enemy-btn" + (selectedEnemyIndex === index ? " selected" : "");
            btn.innerHTML = `<b>${enemy.name} (Lv.${enemy.level})</b><br>HP: ${enemy.currentHealth.toFixed(1)} / ${enemy.health.toFixed(1)}`;
        
            btn.onclick = () => {
                selectedEnemyIndex = index;
                renderEnemies(enemies);
            };

            container.appendChild(btn);
        });
    }

    const wait = ms => new Promise(res => setTimeout(res, ms));

    async function displayLogSequentially(fullMessage) {
        const logEl = document.getElementById("log");
        const sentences = fullMessage.split(/(?<=\!)\s+/).filter(s => s.trim() !== "");
        for (const sentence of sentences) {
            logEl.textContent = sentence;
            await wait(1200);
        }
    }

    async function updateStatus() {
      try {
        const res = await fetch(`${API_URL}/status?sessionId=${sessionId}`, { headers: ngrokHeaders });
        const data = await res.json();
        document.getElementById("playerName").textContent = data.name;
        document.getElementById("playerHp").textContent = data.health;
        document.getElementById("playerCurrentHp").textContent = data.currentHealth
        document.getElementById("playerLevel").textContent = data.level;
        document.getElementById("playerDmg").textContent = data.damage;
        document.getElementById("playerWeapon").textContent = data.weapon;
        document.getElementById("round").textContent = data.round;
        document.getElementById("turn").textContent = data.turn;

        const petMenu = document.querySelector(".petmenu");
        const actionMenu = document.querySelector(".actionmenu");

        if (data.petName && data.petName.trim() !== "") {
            petMenu.style.display = "block";
            actionMenu.style.width = "70vw";

            document.getElementById("petName").textContent = data.petName;
            document.getElementById("petLevel").textContent = data.petLevel;
            document.getElementById("petHp").textContent = data.petHealth;
            document.getElementById("petCurrentHp").textContent = data.petCurrentHealth
            document.getElementById("petDmg").textContent = data.petDamage;

        } 
        else {
            petMenu.style.display = "none";
            actionMenu.style.width = "100vw";
            }
        renderEnemies(data.enemies);
        return data;
      } 
      catch (err) {
        document.getElementById("log").textContent = "Error attempting to connect to the Java server.";
        return null;
      }
      
    }

    let isAdvancing = false;

    async function advanceRound() {
        if (isAdvancing) return;
        isAdvancing = true
        try {
            const res = await fetch(`${API_URL}/action?cmd=advance&sessionId=${sessionId}`, { headers: ngrokHeaders });
            const data = await res.json();
            document.getElementById("log").textContent = data.message;
            await updateStatus();
        } catch (err) {
            document.getElementById("log").textContent = "Error advancing wave.";
        }
        finally {
            isAdvancing = false
        }
    }

    async function playerAttack() {
        try {
            const res = await fetch(`${API_URL}/action?cmd=attack&target=${selectedEnemyIndex}&sessionId=${sessionId}`, { headers: ngrokHeaders });
            const actionData = await res.json();
        
            await displayLogSequentially(actionData.message);

            const statusData = await updateStatus();

            if (statusData && statusData.enemiesLeft === 0) {
                await advanceRound();
            }
        } 
        catch (err) {
            document.getElementById("log").textContent = "Error executing attack.";
        }       
    }

    async function initGame() {
        const data = await updateStatus();
        if (data && data.round === 0) {
            await advanceRound();
        }
    }

    document.querySelector(".actions .ac").addEventListener("click", playerAttack);
    initGame();

</script>
</body>
</html>
