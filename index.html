<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FallenMisery</title>
    <style>
    body { font-family: monospace; background-color: black; color: seagreen; text-align: center;}
    .card { font-size: 3vh; margin: 0 auto; padding-left: 1vw ; text-align: left; border: 0.3vw solid limegreen; width: 17vw; height: 37vh; background-color: whitesmoke; color: palevioletred; margin-bottom: 5vh; break-word; word-break: break-all;}
    button { font-size: 3vh; background: black; color: limegreen; border: 0.3vw solid limegreen; width: 17vw; height: 7vh; margin-bottom: 2vh; cursor: pointer; }
    .del:hover { background:indianred; }
    .conf:hover { background:orangered; }
    .upd:hover { background: lightgoldenrodyellow; }
    button:hover { background: greenyellow; color: limegreen; transform: scale(1.1);}
    </style>
</head>
<body>
  <h1 style="text-align: center; font-size: 2.5vw;">Fallen Misery</h1>

  <div class="card">
    <p><b><span id="playerName">-</span></b></p>
    <p><b>Health:</b> <span id="playerCurrentHp">-</span><span>/</span><span id="playerHp">-</span></p>
    <p><b>Damage:</b> <span id="playerDmg">-</span></p>
    <p><b>Weapon:</b> <span id="playerWeapon">-</span></p>
    <p><b>Round:</b> <span id="round">0</span>.<span id="turn">0</span></p>
  </div>

  <div>
    <a href="FallenMisery.html"><button>🎀 Continue</button></a><br>
    <a href="Uprades.html"><button class="upd">✨ Uprades</button></a><br>
    <a href="Config.html"><button class="conf">⚙️ Config.</button></a><br><br>
    <button onclick="sendAction('delete')" class="del">🦴 Delete Run</button>
  </div>

  <p id="log" style="color: yellow; margin-top: 0.1vh; font-size: 3.5vh;"></p>

  <script>
    const API_URL = "https://sandpaper-purposely-droplet.ngrok-free.dev";
    const ngrokHeaders = {
      "ngrok-skip-browser-warning": "true"
    };

    let sessionId = localStorage.getItem("game_session_id");
    if (!sessionId) {
      sessionId = "player_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("game_session_id", sessionId);
    }

    async function updateStatus() {
      try {
        const res = await fetch(`${API_URL}/status?sessionId=${sessionId}`, { headers: ngrokHeaders });
        const data = await res.json();
        document.getElementById("playerName").textContent = data.name;
        document.getElementById("playerHp").textContent = data.health;
          document.getElementById("playerCurrentHp").textContent = data.currentHealth;
        document.getElementById("playerDmg").textContent = data.damage;
        document.getElementById("playerWeapon").textContent = data.weapon;
        document.getElementById("round").textContent = data.round;
        document.getElementById("turn").textContent = data.turn;
      } catch (err) {
        document.getElementById("log").textContent = "Error attempting to connect to the Java server.";
      }
    }

    async function sendAction(cmd) {
      try {
        const res = await fetch(`${API_URL}/action?sessionId=${sessionId}`, { headers: ngrokHeaders });
        const data = await res.json();
        document.getElementById("log").textContent = data.message;
        updateStatus();
      } catch (err) {
        document.getElementById("log").textContent = "Error sending action.";
      }
    }
    updateStatus();
  </script>
</body>
</html>
